[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "live15-quant-v2"
version = "0.1.0"
description = "Clean rebuild of LIVE15_QUANT."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kalshi-sdk==13.0.0",
    "pandas==3.0.1",
    "questdb==5.0.0",
    "tzdata>=2024.1,<2027",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/live15_quant_v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires an official local QuestDB instance",
]
